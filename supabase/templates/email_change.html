<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Verify your new email — StudyBuddy AI</title></head>
<body style="font-family: 'DM Sans', sans-serif; background: #F7F8FA; padding: 40px;">
  <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 40px;">
    <h1 style="font-size: 22px; color: #2163CA; margin-bottom: 8px;">StudyBuddy AI</h1>
    <p style="color: #444; font-size: 16px; margin-bottom: 24px;">
      Enter this code to verify your email address:
    </p>
    <div style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #2163CA;
                background: #F0F5FF; border-radius: 8px; padding: 20px; text-align: center;">
      {{ .Token }}
    </div>
    <p style="color: #888; font-size: 13px; margin-top: 24px;">
      This code expires in 1 hour. If you did not request this, you can ignore this email.
    </p>
  </div>
</body>
</html>
