<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify your new email — StudyBuddy AI</title></head>
<body style="margin: 0; padding: 40px 16px; background: #F7F4EE; font-family: 'DM Sans', Helvetica, Arial, sans-serif; color: #15283B;">
  <div style="max-width: 480px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E6E2D8; border-radius: 12px; padding: 36px 40px 40px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 28px;">
      <tr>
        <td style="vertical-align: middle; padding-right: 12px;"><img src="https://www.studyybuddyai.com/email-mark.png" width="44" height="44" alt="" style="display: block; border: 0;"></td>
        <td style="vertical-align: middle; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: #15283B;">StudyBuddy <span style="color: #0AAFA9;">AI</span></td>
      </tr>
    </table>
    <p style="color: #3D4A56; font-size: 16px; line-height: 1.5; margin: 0 0 24px;">
      Enter this code to verify your email address:
    </p>
    <div style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #15283B;
                background: #EAF7F6; border: 1px solid #C9ECEA; border-radius: 8px; padding: 20px; text-align: center;">
      {{ .Token }}
    </div>
    <p style="color: #7A838B; font-size: 13px; line-height: 1.5; margin: 24px 0 0;">
      This code expires in 1 hour. If you did not request this, you can ignore this email.
    </p>
  </div>
</body>
</html>
