<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBuddy AI · AI-Powered Study Platform for Medical Students</title>
    <meta name="description" content="StudyBuddy AI turns your curriculum into clinical cases, smart questions, and instant explanations. Built for medical students in MENA. Free to start." />

    <!-- Open Graph (controls LinkedIn, WhatsApp, Facebook previews) -->
    <meta property="og:title" content="StudyBuddy AI · Study Smarter. Score Higher." />
    <meta property="og:description" content="StudyBuddy AI turns your curriculum into clinical cases, smart questions, and instant explanations. Built for medical students in MENA. Free to start." />
    <meta property="og:image" content="https://www.studyybuddyai.com/og-preview.png?v=2" />
    <meta property="og:image:alt" content="StudyBuddy AI: a DNA helix rising into a neuron, beside the line Study smarter. Score higher. Pass." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.studyybuddyai.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyBuddy AI" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyBuddy AI · Study Smarter. Score Higher." />
    <meta name="twitter:description" content="StudyBuddy AI turns your curriculum into clinical cases, smart questions, and instant explanations. Built for medical students in MENA. Free to start." />
    <meta name="twitter:image" content="https://www.studyybuddyai.com/og-preview.png?v=2" />

    <!-- ?v= busts browsers' favicon caches, which key on the URL: bump it
         whenever scripts/brandmark/build-icons.cjs redraws the icons. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <meta name="color-scheme" content="light dark" />

    <!-- Applies the stored theme before first paint. Without this every route
         flashes light while React boots, and routes that never mount a
         ThemeToggle (/reset-password, /404) would ignore the stored choice
         entirely. Kept inline and synchronous on purpose. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
